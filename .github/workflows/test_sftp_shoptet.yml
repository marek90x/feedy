name: test-sftp-shoptet
# Jednorazová diagnostika 7. 11. 2026: nahrá kópiu Shoptet SK OpenAI exportu do SK kanála cez SFTP.
# 594 produktov = kanál funguje, chyba v našom feede; 0 = chyba kanála. Po teste sa súbor zmaže.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/test_sftp_shoptet.yml', 'test/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          OA_SFTP_URI_JAHODARNA_SK: ${{ secrets.OA_SFTP_URI_JAHODARNA_SK }}
          JAHODARNA_SK_OPENAI: ${{ secrets.JAHODARNA_SK_OPENAI }}
        run: |
          pip install --quiet paramiko
          mkdir -p docs/jahodarna
          cp test/shoptet_sk.jsonl.gz docs/jahodarna/openai_sk.jsonl.gz
          gzip -dc docs/jahodarna/openai_sk.jsonl.gz | wc -l
          python nahraj_sftp.py
